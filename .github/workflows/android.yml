name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: normal
            appid: com.gravityflip.play
            appname: Gravity Flip
          - variant: admin
            appid: com.gravityflip.admin
            appname: Gravity Flip Admin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Ajouter les correctifs au jeu
        run: sed -i 's#</body>#<script src="v4.js"></script><script src="variant.js"></script></body>#' www/index.html
      - name: Version admin
        if: matrix.variant == 'admin'
        run: |
          cat > www/variant.js <<'JS'
          (function(){
          var BIG=999999999;
          function give(){S.coins=BIG;S.gems=BIG;S.skins=SK.map(function(_,i){return i});S.themes=TH.map(function(_,i){return i});S.done=TOT}
          give();save();
          var h0=hud;
          hud=function(){S.coins=BIG;S.gems=BIG;h0();document.getElementById('c').textContent='∞';document.getElementById('g').textContent='∞'};
          hud();
          })();
          JS
      - name: Version normale
        if: matrix.variant != 'admin'
        run: |
          cat > www/variant.js <<'JS'
          (function(){
          buyP=function(){toast('Les achats arrivent bientôt')};
          var i0=iap;iap=function(k){i0(k);var m=document.querySelector('#iap .msg');if(m)m.textContent='Les achats arrivent bientôt.'};
          })();
          JS
      - name: Config de la version
        run: |
          sed -i 's/com.gravityflip.game/${{ matrix.appid }}/; s/"appName": "Gravity Flip"/"appName": "${{ matrix.appname }}"/; s/"webDir": "www"/"webDir": "www",\n  "backgroundColor": "#0b1020"/' capacitor.config.json
      - run: npm install
      - run: npx cap add android
      - name: Paysage, plein écran, vibrations
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<activity#<activity android:screenOrientation="sensorLandscape"#' $M
          sed -i 's#<application#<uses-permission android:name="android.permission.VIBRATE" />\n    <application#' $M
          S=android/app/src/main/res/values/styles.xml
          sed -i 's#<style name="AppTheme.NoActionBar" parent="Theme.AppCompat.DayNight.NoActionBar">#&\n        <item name="android:windowFullscreen">true</item>\n        <item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>#' $S
      - name: Plein écran immersif (encoche et barres système)
        run: |
          F=$(find android/app/src/main/java -name MainActivity.java | head -n 1)
          [ -n "$F" ] || exit 0
          P=$(grep -m1 '^package' "$F")
          printf '%s\n' "$P" > "$F"
          cat >> "$F" <<'JAVA'
          import android.os.Build;
          import android.os.Bundle;
          import android.view.WindowManager;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  immersive();
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) immersive();
              }

              private void immersive() {
                  if (Build.VERSION.SDK_INT >= 28) {
                      WindowManager.LayoutParams lp = getWindow().getAttributes();
                      lp.layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
                      getWindow().setAttributes(lp);
                  }
                  WindowCompat.setDecorFitsSystemWindows(getWindow(), false);
                  WindowInsetsControllerCompat c = WindowCompat.getInsetsController(getWindow(), getWindow().getDecorView());
                  c.setSystemBarsBehavior(WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);
                  c.hide(WindowInsetsCompat.Type.systemBars());
              }
          }
          JAVA
      - name: Icône dorée pour la version admin
        if: matrix.variant == 'admin'
        run: sed -i 's/(124, 92, 255), (255, 106, 213)/(20, 24, 40), (255, 176, 0)/' make_icon.py
      - name: Logo de l'app
        run: pip install pillow && python make_icon.py && npx @capacitor/assets@3.0.5 generate --android
        continue-on-error: true
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: gravity-flip-${{ matrix.variant }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
